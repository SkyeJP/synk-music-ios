# SYNK Music iOS CI. The app is built and published by Codemagic (codemagic.yaml)
# on pushes to main; GitLab only runs secret detection on the shared runners.
stages:
  - test
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: "true"

secret_detection:
  stage: secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
