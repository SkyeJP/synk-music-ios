# SYNK Music iOS: unsigned IPA for SideStore / AltStore / Signulous, published to
# mirrors.gafftech.co.uk/ios with an AltStore-format source.json.
#
# Environment group "mirror" (Codemagic UI, App settings > Environment variables):
#   SSH_PRIVATE_KEY  private key allowed to log in to the mirror (secure)
#   MIRROR_USER      SSH user on the mirror
#   MIRROR_HOST      the mirror server's IP (mirrors.gafftech.co.uk is behind Cloudflare, which does not pass SSH)
#   MIRROR_PATH      folder the mirror serves as MIRROR_URL, e.g. /opt/repositories/hostedbysynk/ios
# Optional: MIRROR_URL (defaults to https://mirrors.gafftech.co.uk/ios).
# Workflow vars below would override these group values, so none of them are set here.

workflows:
  ios-unsigned:
    name: SYNK iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - mirror
      vars:
        SCHEME: SynkMusic
        APP_NAME: SYNK
        IPA_NAME: synkmusic.ipa
        HOMEBREW_NO_AUTO_UPDATE: 1
    cache:
      cache_paths:
        - $HOME/Library/Caches/Homebrew
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install XcodeGen
        script: |
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate the Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned Release
        script: |
          #!/bin/bash
          # SideStore only offers an update when the version string changes, so the
          # build number becomes the patch: MARKETING_VERSION 4.0.x in project.yml -> 4.0.<build>.
          BASE=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([0-9]+)\.([0-9]+).*/\1.\2/')
          VERSION="$BASE.${BUILD_NUMBER:-0}"
          echo "Version $VERSION (build ${BUILD_NUMBER:-1})"
          xcodebuild \
            -project SynkMusic.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${BUILD_NUMBER:-1}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build > xcodebuild.log 2>&1 && STATUS=0 || STATUS=$?
          # Compiler errors first, deduplicated, so they are easy to copy from the log.
          grep -E '^/.*: error: ' xcodebuild.log | sed "s|$CM_BUILD_DIR/||" | sort -u | head -150 || true
          tail -5 xcodebuild.log
          exit $STATUS
      - name: Package the IPA
        script: |
          #!/bin/bash
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP"
          rm -rf Payload "$IPA_NAME"
          mkdir Payload
          cp -R "$APP" "Payload/$APP_NAME.app"
          zip -qry "$IPA_NAME" Payload
          ls -l "$IPA_NAME"
    artifacts:
      - synkmusic.ipa
      - xcodebuild.log
    publishing:
      scripts:
        - name: Publish to the GaffTech mirror and SideStore source
          script: |
            #!/bin/bash
            set -euo pipefail
            : "${MIRROR_HOST:?Set MIRROR_HOST in the mirror environment group}"
            MIRROR_URL="${MIRROR_URL:-https://mirrors.gafftech.co.uk/ios}"
            # Publishing scripts run even when the build failed; only publish a finished IPA.
            if [ ! -f "$CM_BUILD_DIR/$IPA_NAME" ]; then
              echo "No IPA was built, nothing to publish"
              exit 0
            fi
            cd "$CM_BUILD_DIR"
            INFO="build/Build/Products/Release-iphoneos/$APP_NAME.app/Info.plist"
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
            MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO")
            SIZE=$(stat -f%z "$IPA_NAME")
            DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            VERSIONED="synkmusic-$VERSION.ipa"
            echo "Publishing $BUNDLE_ID $VERSION, $SIZE bytes"

            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/mirror_key
            chmod 600 ~/.ssh/mirror_key
            SSH_OPTS="-i $HOME/.ssh/mirror_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
            REMOTE="$MIRROR_USER@$MIRROR_HOST"

            # Keep the versions already listed, newest first.
            curl -fsS "$MIRROR_URL/source.json" -o old-source.json || echo '{}' > old-source.json

            python3 - "$BUNDLE_ID" "$VERSION" "$DATE" "$SIZE" "$MIRROR_URL/$VERSIONED" "$MIN_OS" "$MIRROR_URL" <<'PY'
            import json, sys
            bundle, version, date, size, url, min_os, base = sys.argv[1:]
            try:
                old = json.load(open("old-source.json"))
                prev = [v for a in old.get("apps", []) if a.get("bundleIdentifier") == bundle for v in a.get("versions", [])]
            except Exception:
                prev = []
            entry = {
                "version": version, "date": date,
                "localizedDescription": f"SYNK {version}",
                "downloadURL": url, "size": int(size), "minOSVersion": min_os,
            }
            for v in prev:
                v.pop("buildVersion", None)
                v["localizedDescription"] = f"SYNK {v.get('version', '')}"
            versions = [entry] + [v for v in prev if v.get("version") != version]
            source = {
                "name": "SYNK Music",
                "identifier": "uk.co.gafftech.mirrors.synk",
                "subtitle": "SYNK Music for iPhone",
                "website": "https://synkmusic.co.uk",
                "iconURL": f"{base}/icon.png",
                "apps": [{
                    "name": "SYNK",
                    "bundleIdentifier": bundle,
                    "developerName": "SYNK Team",
                    "subtitle": "Stream, sync and listen together",
                    "localizedDescription": "SYNK Music for iPhone: streaming, lyrics, Connect, Listen Together, downloads and device tuning.",
                    "iconURL": f"{base}/icon.png",
                    "tintColor": "#000000",
                    "category": "entertainment",
                    "version": version,
                    "versionDate": date,
                    "versionDescription": entry["localizedDescription"],
                    "downloadURL": url,
                    "size": int(size),
                    "versions": versions[:10],
                    "appPermissions": {"entitlements": [], "privacy": {}},
                }],
                "news": [],
            }
            json.dump(source, open("source.json", "w"), indent=2)
            PY

            ssh $SSH_OPTS "$REMOTE" "mkdir -p '$MIRROR_PATH'"
            scp $SSH_OPTS "$IPA_NAME" "$REMOTE:$MIRROR_PATH/$VERSIONED"
            scp $SSH_OPTS "$IPA_NAME" "$REMOTE:$MIRROR_PATH/$IPA_NAME"
            scp $SSH_OPTS SynkMusic/Assets.xcassets/AppIcon.appiconset/icon-1024.png "$REMOTE:$MIRROR_PATH/icon.png"
            # Write the manifest last, then swap it in, so the feed never points at a missing file.
            scp $SSH_OPTS source.json "$REMOTE:$MIRROR_PATH/source.json.new"
            ssh $SSH_OPTS "$REMOTE" "mv '$MIRROR_PATH/source.json.new' '$MIRROR_PATH/source.json'"
            echo "Source: $MIRROR_URL/source.json"
            echo "Latest IPA: $MIRROR_URL/$IPA_NAME"
